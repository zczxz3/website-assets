<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent controls — Queue Lab</title><link rel="stylesheet" href="queue.css"><style>main{max-width:760px;padding:30px 22px}.controls{background:white;border:1px solid #d7e1e9;border-radius:16px;padding:24px}.controls h1{font-size:36px}.samples{display:flex;gap:30px;margin:20px 0;color:#2463eb}.controls .async{flex:initial}.controls .menu-unit{max-width:460px}</style></head><body><main><p class="eyebrow">WEBSITE ASSETS / INDEPENDENT COMPONENTS</p><h1>Controls with a purpose.</h1><p><a href="queue.html">Open the portfolio workbench →</a></p><section class="controls"><h2>Menu motion</h2><div id="menus"></div><h2>Native choices</h2><label class="choice"><input type="checkbox"><span>Include this item</span></label><label class="choice switch"><input type="checkbox" role="switch"><span>Enable notifications</span></label><fieldset><legend>Display style</legend><label class="choice"><input type="radio" name="layout" checked><span>Grid</span></label><label class="choice"><input type="radio" name="layout"><span>List</span></label></fieldset><h2>Loading patterns</h2><div class="samples" aria-hidden="true"><span class="spinner dots"><i></i><i></i><i></i><i></i></span><span class="spinner wave"><i></i><i></i><i></i><i></i></span></div><div class="load-row"><button id="load" type="button" class="primary async"><span class="spinner dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Load sample data</button><button type="button" id="cancel">Cancel</button></div><p id="status" role="status" aria-live="polite"></p></section></main><script type="module">
import {bindMenu,bindAsync} from './queue-components.mjs';
const bindings=[];
for(const kind of ['spin','spring','collapse']){const section=document.createElement('div');section.className='menu-unit';section.innerHTML=`<div class="menu-top"><span>${kind}</span><button type="button" class="menu-button" data-motion="${kind}" aria-label="Toggle ${kind} menu" aria-expanded="false" aria-controls="${kind}-panel"><i></i><i></i><i></i></button></div><nav class="menu-panel" id="${kind}-panel" hidden><a href="queue.html">Workbench</a></nav>`;document.querySelector('#menus').append(section);bindings.push(bindMenu(section.querySelector('button'),section.querySelector('nav')));}
const loading=bindAsync(document.querySelector('#load'),document.querySelector('#status'),async signal=>{const r=await fetch('./queue-data.json',{signal});if(!r.ok)throw Error('Could not load sample data.');await r.json();});document.querySelector('#cancel').addEventListener('click',()=>loading.cancel());window.addEventListener('pagehide',()=>{loading.destroy();bindings.forEach(b=>b.destroy());},{once:true});document.body.dataset.ready='queue-controls';
</script></body></html>
