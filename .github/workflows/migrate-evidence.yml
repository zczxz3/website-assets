name: One-time approved evidence migration
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/migrate-evidence.yml]
permissions:
  contents: write
concurrency:
  group: approved-evidence-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Archive verified original evidence and remove approved files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution-migrate.py
