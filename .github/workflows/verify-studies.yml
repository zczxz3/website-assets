name: Verify independent studies

on:
  workflow_dispatch:
  push:
    paths:
      - package.json
      - package-lock.json
      - "scripts/**"
      - .github/workflows/verify-studies.yml
      - "motion/study-source.zip"
      - "motion/verify_studies.py"
      - "motion/package_studies.py"
      - "motion/components/*.mjs"
      - "motion/*.mjs"
      - "motion/styles.css"
      - "motion/index.html"
      - "motion/runtime-check.html"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare isolated reports
        shell: bash
        run: |
          REPORT_DIR="${RUNNER_TEMP}/website-study-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'REPORT_DIR=%s\n' "${REPORT_DIR}" >> "${GITHUB_ENV}"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "${RUNNER_TEMP}/rea-playwright-browsers" >> "${GITHUB_ENV}"
          mkdir -p "${REPORT_DIR}"
          printf '%s\n' '{"phase":"initialized","result_file":"component-checks/summary.json"}' > "${REPORT_DIR}/bootstrap.json"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"

      - name: Install locked REA dependencies
        shell: bash
        run: |
          node --version > "${REPORT_DIR}/node-version.txt"
          npm --version > "${REPORT_DIR}/npm-version.txt"
          set +e
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund > "${REPORT_DIR}/npm-ci.stdout.log" 2> "${REPORT_DIR}/npm-ci.stderr.log"
          status=$?
          set -e
          printf '%s\n' "${status}" > "${REPORT_DIR}/npm-ci.exit-code.txt"
          exit "${status}"

      - name: Install the matching Playwright Chromium and system dependencies
        shell: bash
        run: |
          playwright_cli="$(node -e 'const {createRequire}=require("node:module"); const {dirname,join}=require("node:path"); const r=createRequire(join(process.cwd(),"node_modules/rea-agents/package.json")); process.stdout.write(join(dirname(r.resolve("playwright-core/package.json")),"cli.js"));')"
          node -e 'const {createRequire}=require("node:module"); const {join}=require("node:path"); const r=createRequire(join(process.cwd(),"node_modules/rea-agents/package.json")); console.log(JSON.stringify({rea:r("./package.json").version,playwright_core:r("playwright-core/package.json").version,chromium_executable:r("playwright-core").chromium.executablePath()},null,2));' > "${REPORT_DIR}/playwright-runtime.json"
          set +e
          node "${playwright_cli}" install --with-deps chromium > "${REPORT_DIR}/browser-install.stdout.log" 2> "${REPORT_DIR}/browser-install.stderr.log"
          status=$?
          set -e
          printf '%s\n' "${status}" > "${REPORT_DIR}/browser-install.exit-code.txt"
          exit "${status}"

      - name: Verify published source matches the tested archive
        shell: bash
        run: |
          cd motion
          set -euo pipefail
          python3 package_studies.py verify | tee "${REPORT_DIR}/package-verification.json"

      - name: Materialize the reviewed study source bundle
        run: cd motion && python3 -m zipfile -e study-source.zip .

      - name: Check module syntax and algorithm invariants
        run: cd motion && node --test component-tests.mjs

      - name: Verify 15 local components at desktop and mobile widths
        shell: bash
        run: |
          browser_path="$(node -e 'const {createRequire}=require("node:module"); const {join}=require("node:path"); const r=createRequire(join(process.cwd(),"node_modules/rea-agents/package.json")); process.stdout.write(r("playwright-core").chromium.executablePath());')"
          cd motion
          python3 verify_studies.py --rea ../node_modules/.bin/rea --browser "${browser_path}" --output "${REPORT_DIR}/component-checks"

      - name: Follow observed public entry controls
        if: ${{ always() }}
        shell: bash
        run: |
          browser_path="$(node -e 'const {createRequire}=require("node:module"); const {join}=require("node:path"); const r=createRequire(join(process.cwd(),"node_modules/rea-agents/package.json")); process.stdout.write(r("playwright-core").chromium.executablePath());')"
          cd motion
          python3 followup_sites.py --rea ../node_modules/.bin/rea --browser "${browser_path}" --output "${REPORT_DIR}/reference-followups"

      - name: Upload original reports, including after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-study-verification
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7
