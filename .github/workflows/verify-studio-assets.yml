name: Verify Studio asset interface
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-studio-assets.yml
      - studio-pack.py
      - studio-contract.test.ts
      - studio-components.zip
      - studio-catalog.json
      - studio-shelf.mws.json
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            ref: 3f989b2be833f468db600c24aa49194abf5f918e
          - name: portfolio-workbench
            ref: 737dd6a883902d580d7fd8bab60b78bbf2697bcd
          - name: module-roundtrip
            ref: 88d847eb8234dc821a6ef9e2f618a5d823d0ac93
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify reproducible Studio pack
        run: |
          sha256sum studio-components.zip > /tmp/studio-pack.sha256
          python3 studio-pack.py
          sha256sum -c /tmp/studio-pack.sha256
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zczxz3/modular-website-studio
          ref: ${{ matrix.ref }}
          path: studio-fixture
          persist-credentials: false
      - name: Test against the actual Studio interfaces
        run: |
          npm --prefix studio-fixture ci --ignore-scripts --no-audit --no-fund
          cp studio-contract.test.ts studio-fixture/tests/asset-contract.test.ts
          cd studio-fixture
          npx vitest run tests/asset-contract.test.ts --reporter=json --outputFile=../studio-contract-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-contract-${{ matrix.name }}
          path: studio-contract-results.json
